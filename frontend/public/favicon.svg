      <stop offset="0" stop-color="#16090B"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D5A"/>
