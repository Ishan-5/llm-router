# Scrape config for RouteWise metrics.
#
# RouteWise keeps the JSON rollup at GET /metrics (read by the dashboard) and
# exposes the Prometheus text exposition at GET /metrics/prometheus, so the
# metrics_path below matters.
global:
  scrape_interval: 15s

scrape_configs:
  # The backend running in this docker-compose network (service name `backend`).
  - job_name: routewise-local
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["backend:8000"]
        labels:
          env: local

  # The deployed instance, so the Grafana dashboard has data even when the local
  # stack is idle. Remove this block if you only want local scraping.
  - job_name: routewise-render
    metrics_path: /metrics/prometheus
    scheme: https
    static_configs:
      - targets: ["llm-router-d2b2.onrender.com"]
        labels:
          env: render

  # If you run `uvicorn router.main:app` directly on the host instead of in
  # compose, point Prometheus at the host gateway instead:
  #   - targets: ["host.docker.internal:8000"]
