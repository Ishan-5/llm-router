# Dashboard provider: loads every *.json in this folder at Grafana startup, so
# `docker compose up` gives you the RouteWise dashboard with no clicking.
apiVersion: 1

providers:
  - name: RouteWise
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
