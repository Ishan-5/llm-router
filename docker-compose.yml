services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # The container needs no extra privileges at runtime.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
