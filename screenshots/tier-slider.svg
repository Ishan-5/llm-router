<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" font-family="Segoe UI, system-ui, Arial, sans-serif">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="170" rx="16" fill="#0F172A"/>
  <text x="40" y="34" font-size="13" fill="#64748B" letter-spacing="2">SENSITIVITY SLIDER - BALANCED DEFAULT (BOTH BOUNDARIES MOVE)</text>

  <!-- zones: cheap 0-4.5, mid 4.5-6, frontier 6-10 -->
  <rect x="80" y="62" width="288" height="22" rx="11" fill="#34D399" opacity="0.22"/>
  <rect x="368" y="62" width="96" height="22" rx="0" fill="#FBBF24" opacity="0.22"/>
  <rect x="464" y="62" width="256" height="22" rx="11" fill="#F472B6" opacity="0.22"/>
  <line x1="80" y1="73" x2="720" y2="73" stroke="#475569" stroke-width="2"/>

  <g font-size="11" fill="#64748B">
    <text x="80" y="105">0</text>
    <text x="345" y="105">4.5</text>
    <text x="462" y="105">6.0</text>
    <text x="706" y="105">10</text>
    <text x="180" y="105" fill="#34D399">cheap</text>
    <text x="398" y="105" fill="#FBBF24">mid</text>
    <text x="552" y="105" fill="#F472B6">frontier</text>
  </g>

  <!-- cheap_ceil knob (balanced x=368, economy +48, quality -48) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;48 0;0 0;-48 0;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    <line x1="368" y1="48" x2="368" y2="98" stroke="#34D399" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>
    <circle cx="368" cy="48" r="8" fill="#34D399" filter="url(#soft)"/>
  </g>

  <!-- frontier_floor knob (balanced x=464, economy +48, quality -48) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;48 0;0 0;-48 0;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
    <line x1="464" y1="48" x2="464" y2="98" stroke="#F472B6" stroke-width="4" stroke-linecap="round" filter="url(#soft)"/>
    <circle cx="464" cy="48" r="8" fill="#F472B6" filter="url(#soft)"/>
  </g>

  <!-- query score dot (wobbles 3 -> 7) -->
  <circle r="7" fill="#38BDF8" filter="url(#soft)">
    <animate attributeName="cx" values="272;528;272" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="132;132;132" dur="8s" repeatCount="indefinite"/>
  </circle>
  <text x="286" y="138" font-size="11" fill="#38BDF8">query score</text>

  <g font-size="12" fill="#94A3B8">
    <text x="600" y="150">economy +0.75</text>
    <text x="600" y="163">quality -0.75</text>
  </g>
</svg>
